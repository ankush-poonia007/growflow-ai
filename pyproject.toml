[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "growflow-backend"
version = "0.1.0"
description = "GrowFlow — AI-powered internship project execution platform (backend)"
requires-python = ">=3.12"
readme = "README.md"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*"]

# ──────────────────────────────────────────────────────────────
# Ruff — linting and formatting
# ──────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["backend"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
    "RUF", # ruff-specific
]
ignore = [
    "E501",   # line-too-long — handled by formatter
    "B008",   # do-not-perform-function-call-in-default-argument (FastAPI Depends pattern)
    "RUF012", # mutable-class-attributes-default
]

[tool.ruff.lint.isort]
known-first-party = ["backend"]
force-sort-within-sections = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

# ──────────────────────────────────────────────────────────────
# Mypy — type checking
# ──────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
strict = false
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
ignore_missing_imports = true
exclude = [
    "^backend/migrations/",
    "^\\.venv/",
    "^build/",
]

[[tool.mypy.overrides]]
module = [
    "supabase.*",
    "pgvector.*",
    "llama_index.*",
    "langchain.*",
    "langgraph.*",
    "langsmith.*",
    "tavily.*",
    "opentelemetry.*",
    "structlog.*",
]
ignore_missing_imports = true

# ──────────────────────────────────────────────────────────────
# Pytest — test runner
# ──────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
]
markers = [
    "unit: pure unit tests with no external dependencies",
    "integration: tests requiring database or external services",
    "api: HTTP/API-level tests",
    "e2e: end-to-end workflow tests",
    "slow: tests that take significant time",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

# ──────────────────────────────────────────────────────────────
# Coverage
# ──────────────────────────────────────────────────────────────
[tool.coverage.run]
source = ["backend/app"]
omit = [
    "backend/tests/*",
    "backend/migrations/*",
    "*/__init__.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 0
