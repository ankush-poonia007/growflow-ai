# GrowFlow — Alembic Migration Configuration
#
# SAFETY RULES:
# - DATABASE_URL is loaded from environment; never hard-code credentials here.
# - Never apply destructive migrations (DROP TABLE, TRUNCATE) without explicit review.
# - All migrations are forward-only. Applied migrations must never be rewritten.
# - This configuration targets the hosted Supabase/PostgreSQL instance.
#
# Architecture ref: 6B § 50 — Migration Strategy
#
# Usage:
#   alembic upgrade head   — apply all pending migrations
#   alembic revision --autogenerate -m "description"   — generate a new migration
#   alembic history        — list migration history
#   alembic current        — show current revision on the database
#   alembic downgrade -1   — revert one migration (use with care)

[alembic]
# Path to migration scripts — relative to this file location.
script_location = backend/migrations

# sys.path path, will be prepended to sys.path if present.
# defaults to the current working directory.
prepend_sys_path = .

# Migration file naming convention: YYYY_timestamp_slug
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d%%(second).2d_%%(slug)s

# Database URL sourced from environment variable.
# Set DATABASE_URL in .env; never hard-code credentials here.
sqlalchemy.url = %(DATABASE_URL)s

# Timezone for migration timestamps
timezone = UTC

[post_write_hooks]
# No post-write hooks configured.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
